name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # 改成 Windows 的局域网 IP；iPhone 和 Windows 必须同一 Wi-Fi
  API_BASE_URL: http://192.168.1.2:3000/api/v1

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: CocoaPods
        id: pods
        shell: bash
        run: |
          set +e
          pod --version > pod-version.log 2>&1
          cd ios
          pod install > ../pod-install.log 2>&1
          code=$?
          cd ..
          cat pod-version.log
          cat pod-install.log
          if [ $code -ne 0 ]; then
            echo "::error::pod install failed with exit code $code"
            tail -80 pod-install.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $code
          fi

      - name: CocoaPods diagnostics
        if: always()
        run: |
          if [ -f pod-install.log ]; then
            {
              echo '## CocoaPods log'
              echo '```'
              tail -200 pod-install.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned
          path: Runner-unsigned.ipa
