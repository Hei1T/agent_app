name: iOS unsigned build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # 改成 Windows 的局域网 IP；iPhone 和 Windows 必须同一 Wi-Fi
  API_BASE_URL: http://192.168.1.2:3000/api/v1

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        id: build
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" > ios-build.log 2>&1
          code=$?
          tail -200 ios-build.log
          if [ $code -ne 0 ]; then
            echo "::error::iOS build failed with exit code $code"
            tail -100 ios-build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $code
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned
          path: Runner-unsigned.ipa

      - name: Publish public IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-latest
          name: iOS unsigned latest
          prerelease: true
          overwrite_files: true
          files: Runner-unsigned.ipa
