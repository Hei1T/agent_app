name: iOS unsigned build

on:
  workflow_dispatch:

env:
  # 改成 Windows 的局域网 IP；iPhone 和 Windows 必须同一 Wi-Fi
  API_BASE_URL: http://192.168.1.100:3000/api/v1

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned
          path: Runner-unsigned.ipa
